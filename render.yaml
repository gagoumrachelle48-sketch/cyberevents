# Déploiement Render — Plateforme Cyber-Événements
# 3 services : base PostgreSQL, API Express, front React.
# Déployé en mode SECURE (failles corrigées) car exposé sur Internet.
databases:
  - name: cyberevents-db
    databaseName: cyberevents
    user: cyber
    plan: free

services:
  # --- API (backend Express) ---
  - type: web
    name: cyberevents-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: APP_MODE
        value: secure
      - key: DATABASE_URL
        fromDatabase:
          name: cyberevents-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONT_ORIGIN
        value: "*"

  # --- Frontend (React + nginx) ---
  - type: web
    name: cyberevents-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://cyberevents-api.onrender.com
