server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Le front appelle l'API via son URL publique (variable VITE_API_URL),
  # injectée au build. Pas de proxy nginx nécessaire : nginx ne sert que
  # les fichiers statiques du site. Compatible Render ET Docker local.

  # Routage côté React (single page application)
  location / {
    try_files $uri /index.html;
  }
}
