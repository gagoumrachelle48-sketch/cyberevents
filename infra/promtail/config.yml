server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  # T21 : journal HTTP de l'API (une ligne JSON par requête)
  - job_name: cyberevents-http
    static_configs:
      - targets: [localhost]
        labels: { job: http, app: cyberevents, __path__: /logs/http.log }
    pipeline_stages:
      - json:
          expressions:
            status: status
            method: method
            ip: ip
            url: url
      - labels:
          status:
          method:
  # Alertes de sécurité
  - job_name: cyberevents-alerts
    static_configs:
      - targets: [localhost]
        labels: { job: alerts, app: cyberevents, __path__: /logs/alerts.log }
    pipeline_stages:
      - json:
          expressions: { type: type, severity: severity }
      - labels:
          type:
          severity:
